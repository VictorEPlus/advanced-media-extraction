name: Windows build and media tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - name: Install FFmpeg and FFprobe
        shell: powershell
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed.' }
      - name: Build, test and check desktop startup
        shell: powershell
        run: ./scripts/Verify.ps1
      - name: Upload test results and startup diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-test-results
          path: |
            artifacts/test-results/**
            artifacts/smoke-*/smoke-test.txt
            artifacts/smoke-*/startup-error.log
            artifacts/smoke-*/*.png
          if-no-files-found: warn
